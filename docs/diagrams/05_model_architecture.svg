<rect x="920" y="200" width="265" height="100" rx="12" ry="12" fill="#FDF0F6" stroke="#DB2777" stroke-width="2.5"/>
<text x="1052" y="236" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="bold" fill="#111827" text-anchor="middle">DENSE 3 — softmax</text>
<text x="1052" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#6B7280" text-anchor="middle">confidence state</text>
