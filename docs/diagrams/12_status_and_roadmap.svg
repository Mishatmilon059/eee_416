<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Project status and roadmap</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60" y="66" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#111827" text-anchor="start">Where the project stands today</text>
<text x="60" y="96" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="normal" fill="#6B7280" text-anchor="start">Honest status of every stage — built, partly done, or not started</text>
<rect x="60" y="150" width="460" height="450" rx="12" ry="12" fill="#ECFAF4" stroke="#059669" stroke-width="2.5"/>
<text x="82" y="190" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="bold" fill="#059669" text-anchor="start">BUILT AND TESTED</text>
<text x="82" y="232" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="start">•  Web simulation app</text>
<text x="82" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="start">•  Supabase database and schema</text>
<text x="82" y="296" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="start">•  Rule engine in three languages</text>
<text x="82" y="328" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="start">•  Synthetic data generator</text>
<text x="82" y="360" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="start">•  Training pipeline</text>
<text x="82" y="392" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="start">•  int8 TFLite conversion</text>
<text x="82" y="424" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="start">•  ESP32 firmware (written)</text>
<text x="82" y="456" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="start">•  Six hardware bring-up sketches</text>
<text x="82" y="488" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="start">•  Four automated test suites</text>
<text x="82" y="520" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="start">•  Braille image importer</text>
<rect x="560" y="150" width="460" height="450" rx="12" ry="12" fill="#FEF6EC" stroke="#D97706" stroke-width="2.5"/>
<text x="582" y="190" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="bold" fill="#D97706" text-anchor="start">PARTLY DONE</text>
<text x="582" y="232" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="start">•  Braille map: 11 of 50 letters</text>
<text x="602" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="start">verified from reference images</text>
<text x="582" y="328" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="start">•  Audio: 60 clips generated by</text>
<text x="602" y="360" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="start">speech synthesis — usable now,</text>
<text x="602" y="392" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="start">but should be re-recorded by a</text>
<text x="602" y="424" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="start">human speaker before any demo</text>
<rect x="1060" y="150" width="460" height="450" rx="12" ry="12" fill="#FEF0F0" stroke="#DC2626" stroke-width="2.5"/>
<text x="1082" y="190" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="bold" fill="#DC2626" text-anchor="start">NOT STARTED</text>
<text x="1082" y="232" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="start">•  Real learner data collection</text>
<text x="1102" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="start">— this is the critical path</text>
<text x="1082" y="328" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="start">•  Physical hardware assembly</text>
<text x="1082" y="392" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="start">•  Teacher mobile app</text>
<text x="1082" y="456" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#111827" text-anchor="start">•  39 consonant reference images</text>
<rect x="60" y="630" width="1480" height="170" rx="12" ry="12" fill="#FFFFFF" stroke="#111827" stroke-width="2.5"/>
<text x="84" y="668" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#111827" text-anchor="start">THE CRITICAL PATH</text>
<text x="84" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#111827" text-anchor="start">Data collection needs CALENDAR TIME, not effort. Each learner must practise on different days, or two of the</text>
<text x="84" y="731" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#111827" text-anchor="start">14 features — session number and time since last practice — carry no signal whatsoever.</text>
<text x="84" y="758" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#111827" text-anchor="start"></text>
<text x="84" y="785" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="normal" fill="#111827" text-anchor="start">Everything else (hardware, the mobile app, the remaining reference images) can proceed in parallel. Start collecting first.</text>
</svg>
