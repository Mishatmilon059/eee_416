<text x="1482.8" y="759.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#D97706" text-anchor="middle">PLANNED</text>
<text x="60" y="866" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6B7280" text-anchor="start" font-style="italic">Data reaches the app either from the device's SD card or from the same database the web app already writes to — no new pipeline is needed.</text>
