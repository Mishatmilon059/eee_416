<text x="1037" y="452" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#6B7280" text-anchor="start">Confident / hesitant / guessing over time.</text>
<text x="1037" y="476" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#6B7280" text-anchor="start">Catches guessing before it becomes habit.</text>
<rect x="1452.6" y="522" width="60.4" height="22" rx="11" ry="11" fill="#FEF6EC" stroke="#D97706" stroke-width="1.5"/>
<text x="1482.8" y="537.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#D97706" text-anchor="middle">PLANNED</text>
