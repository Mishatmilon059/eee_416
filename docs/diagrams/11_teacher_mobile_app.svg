<text x="492" y="452" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#6B7280" text-anchor="start">Which letters are failing, ranked, so</text>
<text x="492" y="476" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#6B7280" text-anchor="start">teaching time goes where it counts.</text>
