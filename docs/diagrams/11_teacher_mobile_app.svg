<rect x="1452.6" y="300" width="60.4" height="22" rx="11" ry="11" fill="#FEF6EC" stroke="#D97706" stroke-width="1.5"/>
<text x="1482.8" y="315.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#D97706" text-anchor="middle">PLANNED</text>
