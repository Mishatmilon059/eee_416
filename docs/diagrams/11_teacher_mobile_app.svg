<text x="492" y="674" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#6B7280" text-anchor="start">The model's recommended next action,</text>
<text x="492" y="698" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#6B7280" text-anchor="start">written in plain language for the teacher.</text>
